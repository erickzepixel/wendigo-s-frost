name: Publicar Wendigo's Frost 0.4.0 (Nightfall)
on:
  push:
    branches: [overhaul-nightfall-v0.4.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Verificar modelos e JSONs
        run: python3 scripts/validate_assets.py
      - name: Compilar mod Forge
        run: gradle --no-daemon build --stacktrace
      - name: Confirmar JAR principal
        run: test -f build/libs/wendigosfrost-0.4.0.jar
      - name: Publicar ou atualizar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.4.0-nightfall-preview
          JAR=build/libs/wendigosfrost-0.4.0.jar
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title "Wendigo's Frost 0.4.0 — Nightfall - Boss e Progressão (prévia)" \
              --notes "Nightfall 0.4.0: batalha de chefe com 3 fases, habilidades telegrafadas (rugido e pisada gelada), HUD de perigo, atmosfera dinâmica, amuleto defensivo craftável, livro expandido, conquistas e ritual cinematográfico. Forge 1.20.1 + GeckoLib + TerraBlender. Compilado em CI; ainda não testado visualmente no Minecraft."
          fi
