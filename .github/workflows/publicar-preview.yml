name: Publicar Wendigo's Frost 0.7.6 (18 Blockbench Assets)
on:
  push:
    branches: [v0.7.6-18-modelos-bb]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Restaurar escultura 3D original exata
        run: python3 scripts/restore_original_wendigo_glb.py
      - name: Preparar stream de triangulos exatos para a GPU
        run: python3 scripts/bake_exact_mesh.py
      - name: Gerar rig de dez ossos sem perder triangulos
        run: python3 scripts/bake_rig_original.py
      - name: Validar integridade da escultura GLB
        run: python3 scripts/test_original_mesh.py
      - name: Verificar articulacoes e topologia do rig
        run: python3 scripts/test_articulated_rig.py
      - name: Verificar modelos e JSONs
        run: python3 scripts/validate_assets.py
      - name: Verificar regras do ritual
        run: python3 scripts/test_summoning_structure.py
      - name: Validar o novo altar
        run: python3 scripts/test_summoning_structure.py
      - name: Verificar fases, criatividade, craft e loot
        run: python3 scripts/test_phase_forms.py
      - name: Verificar combate, animacoes, dano e amuleto
        run: python3 scripts/test_combat_polish.py
      - name: Validar introducao, ruinas, itens, receitas e lore
        run: python3 scripts/test_lore_expansion.py
      - name: Validar estruturas localizaveis, sementes e particulas
        run: python3 scripts/test_structure_registration.py
      - name: Verificar equipamentos, coracao, terceira fase e /locate
        run: python3 scripts/test_v072_hunters.py
      - name: Validar 500 HP, modelo do coracao e armadura Wendigo
        run: python3 scripts/test_v073_art_hp.py
      - name: Testar rework de 18 itens e remover efeitos visuais da fase 3
        run: python3 scripts/test_v074_rework.py
      - name: Validar quatro arquivos Blockbench e rigging do jogador
        run: python3 scripts/test_v075_blockbench_armor.py
      - name: Confirmar substituicao das calcas e botas sem alterar elmo e peitoral
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, json
          root=pathlib.Path('assets-source/vigilia-bbmodels')
          hashes={
              'calcas':'f0540b4a3ac6e83b90088ebab686be51ff25e1d90feac5c9311b7b704a2ac382',
              'botas':'995a4986cc099c530c748287db926aba1ceaebd77d2c7f2272fc98a01c82ffd3',
              'elmo':'4509b3f0cb469947dacf4149c04780fd34cc62773896e89206bc21b34d67eb4a',
              'peitoral':'fe8370d8b080d83b857ed338f2ddd258e237eaa0af8f2e329858ac50a6c0ed57'
          }
          for part,digest in hashes.items():
              p=root/(part+'_da_vigilia.bbmodel')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,part
              model=json.loads(p.read_text())
              assert all(len(e.get('faces',{}))>=6 for e in model['elements']),part
          assert len(json.loads((root/'calcas_da_vigilia.bbmodel').read_text())['elements'])==9
          assert len(json.loads((root/'botas_da_vigilia.bbmodel').read_text())['elements'])==8
          print('PASS: revised pants/boots, original helmet/chestplate exact')
          PY
      - name: Validar ovo e manual Blockbench originais e interface funcional
        run: python3 scripts/test_v076_egg_manual.py
      - name: Testar 18 modelos originais Blockbench e geometrias OBJ
        run: python3 scripts/test_v076_18_blockbench_models.py
      - name: Compilar mod Forge
        run: gradle --no-daemon build --stacktrace
      - name: Confirmar JAR principal
        run: test -f build/libs/wendigosfrost-0.7.6.jar
      - name: Verificar GLB original dentro do JAR
        run: |
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('build/libs/wendigosfrost-0.7.6.jar') as jar:
              mesh=jar.read('assets/wendigosfrost/models/gltf/wendigo_glacial_exact.glb')
              digest=hashlib.sha256(mesh).hexdigest()
              assert digest == 'e40580c2e51d711878745bed9a9601f8ae6be38f80716c7715c099bc44f6f1d1'
              assert 'assets/wendigosfrost/models/mesh/wendigo_glacial.wfmesh' in jar.namelist(), 'Stream de triangulos ausente'
              assert 'assets/wendigosfrost/models/mesh/wendigo_articulado.wfar' in jar.namelist(), 'Rig articulado ausente'
              import struct
              r=jar.read('assets/wendigosfrost/models/mesh/wendigo_articulado.wfar')
              assert r[:4]==b'WFAR' and struct.unpack_from('<II',r,4)==(1,10)
              print('Rig de 10 ossos presente no JAR')
              print('GLB original e identico ao arquivo 3D criado: SHA256='+digest)
          PY
      - name: Conferir 18 OBJ, texturas Blockbench e blocos no JAR
        run: python3 scripts/test_v076_18_blockbench_models.py build/libs/wendigosfrost-0.7.6.jar
      - name: Verificar texturas e estruturas da expansao no JAR
        run: |
          python3 - <<'PY'
          import zipfile,struct
          jar='build/libs/wendigosfrost-0.7.6.jar'
          tex=[
            ('block','ancient_frost_bricks'),('block','whispering_runestone'),
            ('block','soul_frost_lantern'),('block','soul_frost_lantern_frame'),
            ('block','pale_bone_totem'),('item','whisper_shard'),
            ('item','lost_page'),('item','winter_sigil')
          ]
          with zipfile.ZipFile(jar) as z:
              contents=set(z.namelist())
              for kind,name in tex:
                  path=f'assets/wendigosfrost/textures/{kind}/{name}.png'
                  assert path in contents, 'Missing texture '+path
                  png=z.read(path)
                  assert png[:8]==bytes([137,80,78,71,13,10,26,10]), path
                  assert struct.unpack('>II',png[16:24])==(32,32),path
              for name in ('ancient_ice_shrine','hunter_cairn'):
                  for key in ('configured_feature','placed_feature'):
                      path=f'data/wendigosfrost/worldgen/{key}/{name}.json'
                      assert path in contents,path
              for path in ('com/exemplo/wendigosfrost/client/LoreIntroScreen.class',
                           'com/exemplo/wendigosfrost/network/ModNetwork.class',
                           'com/exemplo/wendigosfrost/worldgen/LostRuinFeature.class'):
                  assert path in contents,path
              print('OK: oito PNGs 32x32, duas ruinas e tela de introducao no JAR')
          PY
      - name: Validar modelos NBT de estruturas e loot dentro do JAR
        run: python3 scripts/test_built_jigsaw_templates.py build/libs/wendigosfrost-0.7.6.jar
      - name: Garantir classes e texturas da armadura original no JAR
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/libs/wendigosfrost-0.7.6.jar') as jar:
              names=set(jar.namelist())
              for cls in ('WendigoHunterArmorModel','VigilArmorMesh','VigilArmorItemRenderer'):
                  assert 'com/exemplo/wendigosfrost/client/'+cls+'.class' in names
              for item in ('elmo','peitoral','calcas','botas'):
                  assert 'assets/wendigosfrost/armor_bb/'+item+'.json' in names
                  assert 'assets/wendigosfrost/textures/models/armor/vigilia_bb_'+item+'.png' in names
              print('PASS: 4 original wearable Blockbench armor meshes preserved')
          PY
      - name: Conferir 4 modelos BB e PNGs originais no JAR
        run: |
          python3 - <<'PY'
          import zipfile,struct,json,hashlib
          filepath='build/libs/wendigosfrost-0.7.6.jar'
          ids=('elmo','peitoral','calcas','botas')
          counts=(8,9,9,8)
          orig_tex=(6,5,3,3)
          with zipfile.ZipFile(filepath) as jar:
              keys=set(jar.namelist())
              for id,expected,texnum in zip(ids,counts,orig_tex):
                  mesh='assets/wendigosfrost/armor_bb/'+id+'.json'
                  png='assets/wendigosfrost/textures/models/armor/vigilia_bb_'+id+'.png'
                  assert mesh in keys and png in keys,(mesh,png)
                  data=json.loads(jar.read(mesh))
                  assert len(data['elements'])==expected,(id,len(data['elements']))
                  assert len(data['elements'][0]['faces'])==6
                  assert data['textureWidth']==512 and data['textureHeight']==64
                  raw=jar.read(png)
                  assert raw[:8]==bytes([137,80,78,71,13,10,26,10]),png
                  assert struct.unpack('>II',raw[16:24])==(512,64),png
                  assert len(raw)>10000,(id,len(raw))
                  print(id,expected,'exact BB cubes;',texnum,'original material tiles;',len(raw),'PNG bytes')
              for klass in ('VigilArmorMesh','VigilArmorItemRenderer','WendigoHunterArmorModel'):
                  assert 'com/exemplo/wendigosfrost/client/'+klass+'.class' in keys,klass
              for item in ('hunter_helmet','hunter_chestplate','hunter_leggings','hunter_boots'):
                  data=json.loads(jar.read('assets/wendigosfrost/models/item/'+item+'.json'))
                  assert data['parent']=='builtin/entity'
              print('PASS: original shared BB geometry and original 512x64 materials in all inventory/worn armor items')
          PY
      - name: Verificar modelos originais, texturas e interface no JAR sem mudar a versao
        run: |
          python3 - <<'PY'
          import zipfile,base64,json,hashlib,struct
          with zipfile.ZipFile('build/libs/wendigosfrost-0.7.6.jar') as z:
              names=set(z.namelist())
              base='assets/wendigosfrost/'
              for item,source,ntextures in (
                  ('wendigo_spawn_egg','ovo_de_invocacao_wendigo',4),
                  ('guide_book','manual_do_sobrevivente',5)):
                  bb=json.load(open('assets-source/item-bbmodels/'+source+'.bbmodel'))
                  p=base+'models/item/'+item+'.json'
                  assert p in names,p
                  model=json.loads(z.read(p))
                  assert len(model['elements'])==len(bb['elements'])==5
                  assert len(model['textures'])==ntextures
                  for i,tex in enumerate(bb['textures']):
                      png=base+'textures/item/blockbench/'+item+'_'+str(i)+'.png'
                      assert png in names,png
                      expected=base64.b64decode(tex['source'].split(',',1)[-1])
                      assert z.read(png)==expected,('PNG source mismatch',png)
                      assert struct.unpack('>II',expected[16:24])==(64,64)
                  print('PASS',item,':',len(bb['elements']),'original cubes and',ntextures,'unmodified PNGs')
              for cls in ('item/GuideBookItem','client/SurvivorManualScreen'):
                  assert 'com/exemplo/wendigosfrost/'+cls+'.class' in names,cls
              assert 'assets/wendigosfrost/models/item/wendigo_spawn_egg.json' in names
              print('PASS: interactive client manual, genuine Forge spawn egg item assets and unchanged 0.7.6 jar')
          PY
      - name: Publicar ou atualizar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.7.6-18-modelos-bb
          JAR=build/libs/wendigosfrost-0.7.6.jar
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title "Wendigo's Frost 0.7.6 — 18 Modelos Blockbench (prévia)" \ \
              --notes "Wendigo's Frost 0.7.6 (sem alterar o numero): 18 modelos Blockbench originais para 5 blocos (Tijolos de Gelo Ancestral, Totem dos Cacadores, Lanterna de Almas, Pedestal das Geleiras, Pedra dos Sussurros) e 13 itens (Lanca Runica, Machado do Degelo, Espada do Coracao Partido, Tocha Runica, Amuleto, Chifre de Wendigo, Coracao Congelado, Cristal Frostbloom, Fragmento do Sussurro, Pagina do Cacador, Selo do Inverno, Sementes de Flor-Gelo e Sinalizador Termico). Meshes Forge OBJ permitem preservar rotacoes originais e faces UV; dez texturas PNG 64x64 originais usadas sem alteracoes. Modelos originais BB preservados para edicao. Blocos usam mesma geometria no inventario e no mundo; receitas, drops, vida do Wendigo 500 HP, ovo e manual interativo 0.7.6, armadura Blockbench permanecem. Testes CI validam fontes PNG e models no JAR; confirmar visual no cliente Minecraft antes de usar em mundo principal."
          fi
