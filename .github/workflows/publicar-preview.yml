name: Publicar Wendigo's Frost 0.7.2 (Ruínas Localizáveis)
on:
  push:
    branches: [v0.7.2-cacadores-coracao-espinhos]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Restaurar escultura 3D original exata
        run: python3 scripts/restore_original_wendigo_glb.py
      - name: Preparar stream de triangulos exatos para a GPU
        run: python3 scripts/bake_exact_mesh.py
      - name: Gerar rig de dez ossos sem perder triangulos
        run: python3 scripts/bake_rig_original.py
      - name: Validar integridade da escultura GLB
        run: python3 scripts/test_original_mesh.py
      - name: Verificar articulacoes e topologia do rig
        run: python3 scripts/test_articulated_rig.py
      - name: Verificar modelos e JSONs
        run: python3 scripts/validate_assets.py
      - name: Verificar regras do ritual
        run: python3 scripts/test_summoning_structure.py
      - name: Validar o novo altar
        run: python3 scripts/test_summoning_structure.py
      - name: Verificar fases, criatividade, craft e loot
        run: python3 scripts/test_phase_forms.py
      - name: Verificar combate, animacoes, dano e amuleto
        run: python3 scripts/test_combat_polish.py
      - name: Validar introducao, ruinas, itens, receitas e lore
        run: python3 scripts/test_lore_expansion.py
      - name: Validar estruturas localizaveis, sementes e particulas
        run: python3 scripts/test_structure_registration.py
      - name: Verificar equipamentos, coracao, terceira fase e /locate
        run: python3 scripts/test_v072_hunters.py
      - name: Compilar mod Forge
        run: gradle --no-daemon build --stacktrace
      - name: Confirmar JAR principal
        run: test -f build/libs/wendigosfrost-0.7.2.jar
      - name: Verificar GLB original dentro do JAR
        run: |
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('build/libs/wendigosfrost-0.7.2.jar') as jar:
              mesh=jar.read('assets/wendigosfrost/models/gltf/wendigo_glacial_exact.glb')
              digest=hashlib.sha256(mesh).hexdigest()
              assert digest == 'e40580c2e51d711878745bed9a9601f8ae6be38f80716c7715c099bc44f6f1d1'
              assert 'assets/wendigosfrost/models/mesh/wendigo_glacial.wfmesh' in jar.namelist(), 'Stream de triangulos ausente'
              assert 'assets/wendigosfrost/models/mesh/wendigo_articulado.wfar' in jar.namelist(), 'Rig articulado ausente'
              import struct
              r=jar.read('assets/wendigosfrost/models/mesh/wendigo_articulado.wfar')
              assert r[:4]==b'WFAR' and struct.unpack_from('<II',r,4)==(1,10)
              print('Rig de 10 ossos presente no JAR')
              print('GLB original e identico ao arquivo 3D criado: SHA256='+digest)
          PY
      - name: Validar modelos e textura dentro do JAR
        run: |
          python3 - <<'PY'
          import json,zipfile
          path='build/libs/wendigosfrost-0.7.2.jar'
          base='assets/wendigosfrost/'
          with zipfile.ZipFile(path) as jar:
              names=set(jar.namelist())
              for item in ('wendigo_horn','frozen_heart','frost_ward'):
                  name=base+'models/item/'+item+'.json'
                  assert name in names, 'Modelo ausente no JAR: '+name
                  model=json.loads(jar.read(name))
                  assert len(model['elements'])>=30
              tex=base+'textures/item/relic_atlas.png'
              assert tex in names, 'Textura customizada nao foi incluida no JAR'
              signature=jar.read(tex)
              assert signature[:4] == bytes([137,80,78,71]), 'PNG invalido'
              ward_texture=base+'textures/item/frost_ward_atlas.png'
              assert ward_texture in names, 'Textura dedicada ao amuleto ausente'
              png=jar.read(ward_texture)
              assert png[:4] == bytes([137,80,78,71]), 'Textura do amuleto invalida'
              from struct import unpack
              assert unpack('>II',png[16:24]) == (256,256), 'Atlas do amuleto com tamanho incorreto'
              print('Amuleto: atlas 256x256 presente e valido')
              print('OK: 3 modelos 3D + textura PNG no JAR')
          PY
      - name: Verificar texturas e estruturas da expansao no JAR
        run: |
          python3 - <<'PY'
          import zipfile,struct
          jar='build/libs/wendigosfrost-0.7.2.jar'
          tex=[
            ('block','ancient_frost_bricks'),('block','whispering_runestone'),
            ('block','soul_frost_lantern'),('block','soul_frost_lantern_frame'),
            ('block','pale_bone_totem'),('item','whisper_shard'),
            ('item','lost_page'),('item','winter_sigil')
          ]
          with zipfile.ZipFile(jar) as z:
              contents=set(z.namelist())
              for kind,name in tex:
                  path=f'assets/wendigosfrost/textures/{kind}/{name}.png'
                  assert path in contents, 'Missing texture '+path
                  png=z.read(path)
                  assert png[:8]==bytes([137,80,78,71,13,10,26,10]), path
                  assert struct.unpack('>II',png[16:24])==(32,32),path
              for name in ('ancient_ice_shrine','hunter_cairn'):
                  for key in ('configured_feature','placed_feature'):
                      path=f'data/wendigosfrost/worldgen/{key}/{name}.json'
                      assert path in contents,path
              for path in ('com/exemplo/wendigosfrost/client/LoreIntroScreen.class',
                           'com/exemplo/wendigosfrost/network/ModNetwork.class',
                           'com/exemplo/wendigosfrost/worldgen/LostRuinFeature.class'):
                  assert path in contents,path
              print('OK: oito PNGs 32x32, duas ruinas e tela de introducao no JAR')
          PY
      - name: Validar modelos NBT de estruturas e loot dentro do JAR
        run: python3 scripts/test_built_jigsaw_templates.py build/libs/wendigosfrost-0.7.2.jar
      - name: Verificar modelos, texturas e armaduras no JAR
        run: |
          python3 - <<'PY'
          import zipfile,struct,json
          with zipfile.ZipFile('build/libs/wendigosfrost-0.7.2.jar') as z:
              names=set(z.namelist())
              for id in ('hunter_helmet','hunter_chestplate','hunter_leggings',
                         'hunter_boots','rune_spear','thaw_axe','thermal_flare'):
                  p='assets/wendigosfrost/textures/item/'+id+'.png'
                  assert p in names,p
                  img=z.read(p)
                  assert img[:8]==bytes([137,80,78,71,13,10,26,10])
                  assert struct.unpack('>II',img[16:24])==(32,32)
              for layer in (1,2):
                  p=f'assets/wendigosfrost/textures/models/armor/vigilia_layer_{layer}.png'
                  assert p in names,p
                  assert struct.unpack('>II',z.read(p)[16:24])==(64,32)
              p='assets/wendigosfrost/textures/item/frozen_heart_atlas.png'
              assert p in names and struct.unpack('>II',z.read(p)[16:24])==(128,128)
              model=json.loads(z.read('assets/wendigosfrost/models/item/frozen_heart.json'))
              assert len(model['elements'])>=40
              for path in (
                  'com/exemplo/wendigosfrost/client/WendigoPhaseDetails.class',
                  'com/exemplo/wendigosfrost/event/CombatEquipmentEvents.class',
                  'com/exemplo/wendigosfrost/item/HunterArmorMaterial.class'):
                  assert path in names,path
              print('PASS: 7 item sprites, 2 armor layers, 3D heart and combat classes')
          PY
      - name: Publicar ou atualizar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.7.2-cacadores
          JAR=build/libs/wendigosfrost-0.7.2.jar
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title "Wendigo's Frost 0.7.2 — Caçadores da Vigília — Coração e Espinhos (prévia)" \
              --notes "Wendigo's Frost 0.7.2: correcao do /locate structure (pasta structure/ singular do Minecraft 1.20.1); coracao glacial exposto e pulsante na fase bípede, olhos vermelhos e nove espinhos de gelo crescentes na fase tres. Coração Congelado 3D remodelado. Nova armadura Vigília de quatro peças, lança rúnica, machado do degelo e sinalizador térmico com receitas, bonus anti-Wendigo, sprites e texturas de armadura próprias. Modelo GLB original preservado. Compilacao validada; efeitos visuais e estruturas requerem teste dentro do Minecraft."
          fi
