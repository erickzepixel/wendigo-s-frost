name: Publicar Wendigo's Frost 0.3.2 (modelos corrigidos e guia)
on:
  push:
    branches: [fix-summon-v0.3.2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Compilar mod Forge
        run: gradle --no-daemon build --stacktrace
      - name: Confirmar JAR principal
        run: test -f build/libs/wendigosfrost-0.3.2.jar
      - name: Publicar ou atualizar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.3.2-modelos-guia
          JAR=build/libs/wendigosfrost-0.3.2.jar
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title "Wendigo's Frost 0.3.2 — Modelos e Guia (prévia)" \
              --notes "Reconstrucao dos modelos 3D, textura do Wendigo 128x128 gerada no build, livro de instrucoes entregue no primeiro login e site de documentacao. Minecraft Forge 1.20.1, GeckoLib e TerraBlender. Compilado pelo GitHub Actions; teste de renderizacao no jogo ainda necessario."
          fi
