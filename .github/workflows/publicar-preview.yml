name: Publicar Wendigo's Frost 0.4.2 (Ritual de Invocação)
on:
  push:
    branches: [ritual-invocacao-v0.4.2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Verificar modelos e JSONs
        run: python3 scripts/validate_assets.py
      - name: Verificar regras do ritual
        run: python3 scripts/test_summoning_structure.py
      - name: Validar o novo altar
        run: python3 scripts/test_summoning_structure.py
      - name: Compilar mod Forge
        run: gradle --no-daemon build --stacktrace
      - name: Confirmar JAR principal
        run: test -f build/libs/wendigosfrost-0.4.2.jar
      - name: Validar modelos e textura dentro do JAR
        run: |
          python3 - <<'PY'
          import json,zipfile
          path='build/libs/wendigosfrost-0.4.2.jar'
          base='assets/wendigosfrost/'
          with zipfile.ZipFile(path) as jar:
              names=set(jar.namelist())
              for item in ('wendigo_horn','frozen_heart','frost_ward'):
                  name=base+'models/item/'+item+'.json'
                  assert name in names, 'Modelo ausente no JAR: '+name
                  model=json.loads(jar.read(name))
                  assert len(model['elements'])>=30
              tex=base+'textures/item/relic_atlas.png'
              assert tex in names, 'Textura customizada nao foi incluida no JAR'
              signature=jar.read(tex)
              assert signature[:4] == bytes([137,80,78,71]), 'PNG invalido'
              print('OK: 3 modelos 3D + textura PNG no JAR')
          PY
      - name: Publicar ou atualizar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.4.2-ritual-invocacao
          JAR=build/libs/wendigosfrost-0.4.2.jar
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title "Wendigo's Frost 0.4.2 — Invocação Instantânea (prévia)" \
              --notes "Versao 0.4.2: quatro fogueiras das almas acesas e quatro gelos azuis em torno do pedestal permitem invocar um Wendigo imediatamente ao agachar e usar um Cristal Frostbloom. Verificacao de espaco, cooldown de dois minutos, efeitos e guia atualizados. Requer Forge 1.20.1, GeckoLib e TerraBlender. Ainda necessita teste no jogo."
          fi
