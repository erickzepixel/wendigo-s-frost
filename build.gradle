plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { wendigosfrost { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation fg.deobf('maven.modrinth:kkmrDlKT:HI0iCUpi')
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

// Produz um JAR reobfuscado para o Forge de produção, não só para o ambiente de desenvolvimento.
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
