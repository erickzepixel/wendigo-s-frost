plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { wendigosfrost { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'glTF-Renderer-API'; url = 'https://danialisntcool.github.io/gLTF-Renderer-Api---Minecraft-Forge-1.20.1/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation fg.deobf('maven.modrinth:kkmrDlKT:HI0iCUpi')
    implementation fg.deobf('me.danialisntcool.gltfapi:gltf_renderer_api:1.0.0-beta.1')
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

// Produz um JAR reobfuscado para o Forge de produção, não só para o ambiente de desenvolvimento.
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }


// Recria um atlas 128x128 coerente com as UVs do Wendigo.
// O PNG original 64x64 nao corresponde a geometria detalhada.
tasks.named('processResources', ProcessResources).configure {
    doLast {
        def dir = new File(destinationDir, 'assets/wendigosfrost/textures/entity')
        dir.mkdirs()
        def out = new File(dir, 'wendigo.png')
        def atlas = new java.awt.image.BufferedImage(128, 128, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def rng = new java.util.Random(30112026L)
        for (int y = 0; y < 128; y++) {
            for (int x = 0; x < 128; x++) {
                int variance = rng.nextInt(19) - 9
                int r, g, b
                if (x < 64 && y < 48) { // pele escura da criatura
                    r = 29 + variance; g = 41 + variance; b = 48 + variance
                } else if (x < 64 && y < 96) { // musculatura azulada
                    r = 32 + variance; g = 50 + variance; b = 64 + variance
                } else if (x >= 64 && x < 96 && y < 48) { // ossos marfim
                    r = 169 + variance; g = 157 + variance; b = 131 + variance
                } else if (x >= 64 && x < 96 && y < 88) { // frestas e sombra dos ossos
                    r = 69 + variance; g = 76 + variance; b = 77 + variance
                } else if (x >= 96 && y < 48) { // gelo
                    r = 80 + variance; g = 166 + variance; b = 201 + variance
                } else if (x >= 96 && y < 88) { // gelo brilhante
                    r = 111 + variance; g = 215 + variance; b = 229 + variance
                } else if (x >= 96) { // olhos espectrais azul-gelo
                    r = 69 + variance; g = 207 + variance; b = 244 + variance
                } else {
                    r = 34 + variance; g = 49 + variance; b = 54 + variance
                }
                // Veios amplos sobre a pele simularam pelagem congelada sem microcubos.
                // Ossos recebem rachaduras escuras; areas geladas, brilho azul.
                if (x < 64 && y < 48 && ((x * 7 + y * 13) % 47 < 3)) {
                    r += 31; g += 39; b += 49
                }
                if (x >= 64 && x < 96 && y < 48 && ((x * 3 + y * 7) % 53 < 2)) {
                    r -= 52; g -= 48; b -= 41
                }
                if (x >= 96 && y < 88 && ((x * 2 + y * 5) % 23 < 2)) {
                    r += 34; g += 32; b += 27
                }
                r = Math.max(0, Math.min(255, r))
                g = Math.max(0, Math.min(255, g))
                b = Math.max(0, Math.min(255, b))
                atlas.setRGB(x, y, (0xff << 24) | (r << 16) | (g << 8) | b)
            }
        }
        javax.imageio.ImageIO.write(atlas, 'png', out)
    }
}


// Atlas proprio para os itens 3D. Todas as faces apontam para celulas de 32px
// em uma unica textura 128px, com materiais em UV explicitamente delimitados.
// O arquivo e gerado tanto no build local quanto no GitHub Actions.
tasks.named('processResources', ProcessResources).configure {
    doLast {
        def folder = new File(destinationDir, 'assets/wendigosfrost/textures/item')
        folder.mkdirs()
        def atlas = new java.awt.image.BufferedImage(128, 128, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        // osso, osso sombreado, osso iluminado, runa;
        // gelo, gelo escuro, gelo claro, gelo profundo;
        // coracao, coracao vivo, tecido escuro, veias;
        // prata, ferro, ouro antigo, luz cian
        def palette = [
            [204,190,164], [120,108,99], [233,226,199], [44,48,57],
            [81,166,208], [31,97,148], [179,235,245], [26,68,105],
            [126,37,62], [192,73,104], [66,26,49], [35,135,170],
            [172,185,201], [65,79,99], [184,139,84], [103,238,239]
        ]
        def rng = new java.util.Random(20261102041L)
        for (int y=0; y<128; y++) {
            for (int x=0; x<128; x++) {
                int tx = (int)(x / 32)
                int ty = (int)(y / 32)
                int tile = ty*4 + tx
                def p = palette[tile]
                int u = x % 32, v = y % 32
                int grain = rng.nextInt(19)-9
                int streak = (((u*7+v*11+tile*13) % 43) < 3) ? -19 : 0
                int frost = (tile>=4 && tile<=7 && ((u-v+80)%19 < 2)) ? 21 : 0
                int shadow = (u<3 || v>28) ? -12 : ((u>27 || v<3) ? 10 : 0)
                int red = Math.max(0,Math.min(255,p[0]+grain+streak+frost+shadow))
                int green = Math.max(0,Math.min(255,p[1]+grain+streak+frost+shadow))
                int blue = Math.max(0,Math.min(255,p[2]+grain+streak+frost+shadow))
                // Small bright veins on runic/ice tiles, dark blood striations in the heart.
                if (tile == 3 && ((u+v*2)%23 < 2)) { red=74; green=149; blue=166 }
                if (tile == 11 && ((u*2+v)%17 < 2)) { red=92; green=211; blue=232 }
                if (tile>=8 && tile<=10 && ((u+v*3)%21 < 2)) {
                    red=Math.max(0,red-23); green=Math.max(0,green-10)
                }
                atlas.setRGB(x,y,(0xff<<24) | (red<<16) | (green<<8) | blue)
            }
        }
        javax.imageio.ImageIO.write(atlas, 'png', new File(folder,'relic_atlas.png'))
    }
}
