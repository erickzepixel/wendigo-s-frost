// Nine original 32x32 textures. Generated by the same Gradle build that creates
// the distributable JAR; no Pillow/Python or third-party texture downloads.
// The color palettes, glyph designs and silhouettes are original to Wendigo's Frost.
tasks.named('processResources', ProcessResources).configure {
    doLast {
        def blockPath = new File(destinationDir, 'assets/wendigosfrost/textures/block')
        def itemPath = new File(destinationDir, 'assets/wendigosfrost/textures/item')
        blockPath.mkdirs()
        itemPath.mkdirs()

        def palettes = [
            ancient_frost_bricks: [97, 140, 160],
            whispering_runestone: [31, 62, 83],
            soul_frost_lantern: [64, 179, 220],
            soul_frost_lantern_frame: [34, 57, 78],
            pale_bone_totem: [179, 166, 145],
            whisper_shard: [85, 205, 245],
            lost_page: [195, 180, 146],
            winter_sigil: [53, 122, 178]
        ]
        def clamp = { int v -> Math.max(0, Math.min(255, v)) }
        palettes.each { key, base ->
            def img = new java.awt.image.BufferedImage(
                32, 32, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y=0; y<32; ++y) for (int x=0; x<32; ++x) {
                int noise = ((x*17+y*41+x*y*3+key.length()*31) % 23)-11
                int r=base[0]+noise, g=base[1]+noise, b=base[2]+noise
                int alpha=255
                if (key=='ancient_frost_bricks') {
                    int offset = ((int)(y/8)%2)*8
                    boolean mortar = y%8==0 || (x+offset)%16==0
                    if (mortar) { r-=53;g-=49;b-=38 }
                    else if ((x+y*3)%13==0) { r+=23;g+=31;b+=35 }
                } else if (key=='whispering_runestone') {
                    if ((x*11+y*5)%29<2) { r+=12;g+=14;b+=21 }
                    if (x<2||y<2||x>29||y>29) {r-=17;g-=16;b-=14}
                } else if (key=='soul_frost_lantern') {
                    double d=Math.hypot(x-15.5,y-15.5)
                    int bright=(int)Math.max(0,75-d*5)
                    r+=bright/3;g+=bright;b+=bright
                    if ((x+y)%17==0) { r+=32;g+=30;b+=23 }
                } else if (key=='soul_frost_lantern_frame') {
                    if (x%8<2 || y%8<2) {r+=20;g+=30;b+=34}
                    if ((x-4)%16==0 && (y-4)%16==0) {r+=63;g+=70;b+=65}
                } else if (key=='pale_bone_totem') {
                    if ((x*3+y*7)%43<2) {r-=58;g-=51;b-=40}
                    if (x%15==0) {r+=20;g+=22;b+=22}
                } else if (key=='whisper_shard') {
                    int radius= (int)(11*(1-Math.abs(y-15.5)/17.5))
                    if (Math.abs(x-15.5)>radius || y<2 || y>29) alpha=0
                    else {
                        int shine=(int)Math.max(0,65-Math.abs(x-12)*9)
                        r+=shine/3;g+=shine;b+=shine
                        if (x==15||x==16) {r+=25;g+=23;b+=13}
                    }
                } else if (key=='lost_page') {
                    if (x<5||x>26||y<3||y>28) alpha=0
                    else {
                        if (x<7||x>24||y<5||y>26) {r-=65;g-=58;b-=49}
                        if (y>=10 && y<=24 && y%4==1 && x>=9 && x<=23) {r-=91;g-=91;b-=81}
                        if (x==18 && y<9) {r-=58;g-=50;b-=29}
                    }
                } else if (key=='winter_sigil') {
                    double d=Math.hypot(x-15.5,y-15.5)
                    if (d>14.2) alpha=0
                    else {
                        if (d>11.2 || (d>7.4 && d<8.6)) {r+=68;g+=73;b+=71}
                        else {r-=15;g+=12;b+=25}
                        if (Math.abs(x-15.5)<1.5 || Math.abs(y-15.5)<1.5 ||
                            Math.abs(Math.abs(x-15.5)-Math.abs(y-15.5))<1.3) {
                            if(d<10.5) {r+=70;g+=75;b+=63}
                        }
                    }
                }
                int pixel=(alpha<<24)|(clamp(r)<<16)|(clamp(g)<<8)|clamp(b)
                img.setRGB(x,y,pixel)
            }
            def g2=img.createGraphics()
            g2.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
            if (key=='whispering_runestone') {
                g2.setColor(new java.awt.Color(88, 228, 252, 245))
                g2.drawOval(5,5,21,21)
                g2.drawLine(16,7,16,25)
                g2.drawLine(9,12,23,20)
                g2.drawLine(9,20,23,12)
                g2.setColor(new java.awt.Color(168,245,255,200))
                g2.drawLine(12,16,20,16)
            }
            if (key=='soul_frost_lantern') {
                g2.setColor(new java.awt.Color(205,251,255,230))
                g2.fillRect(14,6,4,19)
                g2.fillRect(7,14,18,3)
                g2.setColor(new java.awt.Color(255,255,255,190))
                g2.fillRect(15,12,2,6)
            }
            if (key=='pale_bone_totem') {
                g2.setColor(new java.awt.Color(55,70,74,230))
                g2.fillRect(8,9,5,4)
                g2.fillRect(19,9,5,4)
                g2.drawLine(12,21,20,21)
                g2.drawLine(16,18,16,24)
                g2.setColor(new java.awt.Color(231,235,224,210))
                g2.drawLine(4,3,12,6)
                g2.drawLine(20,6,28,3)
            }
            if (key=='winter_sigil') {
                g2.setColor(new java.awt.Color(196,252,255,240))
                g2.drawOval(8,8,16,16)
                g2.fillOval(13,13,6,6)
            }
            g2.dispose()
            File outDir= (key in ['whisper_shard','lost_page','winter_sigil']) ? itemPath : blockPath
            javax.imageio.ImageIO.write(img, 'png', new File(outDir, key+'.png'))
        }
    }
}
